<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TokenStep</title>
  <link rel="icon" type="image/png" href="../shared/logo.png" />
  <link rel="stylesheet" href="../shared/app.css" />
</head>
<body>
  <div id="app"></div>

  <script>
    // Console error capture (hidden, for debugging via F12 devtools only).
    window.onerror = function (msg, src, line, col, err) {
      console.error('TokenStep:', msg, '@', line + ':' + col, err || '');
      return false;
    };
  </script>
  <script src="../shared/app.js"></script>
  <script src="../shared/i18n.js"></script>
  <script>
    // Startup: fetch data, then render. Any error is caught + logged.
    (async function () {
      try {
        var set = await window.TS.invoke('get_settings');
        var snap = await window.TS.invoke('get_snapshot');
        _startReal(set, snap);
      } catch (e) {
        console.error('TokenStep init failed:', e);
        document.getElementById('app').innerHTML =
          '<div style="padding:60px;text-align:center;color:var(--muted)">' +
          '<h2 style="color:var(--ink)">' + window.TS.t('启动失败') + '</h2>' +
          '<p>' + (e && e.message ? e.message : String(e)) + '</p>' +
          '<p style="margin-top:16px">' + window.TS.t('请按 F12 打开开发者工具查看详情，或重新启动。') + '</p></div>';
      }
    })();

    function _startReal(initialSettings, initialSnapshot) {
      // Apply saved color theme immediately (port of macOS Theme.swift).
      window.TS.applyTheme((initialSettings && initialSettings.theme) || 'green');
      // Restore the full dashboard logic here, using verified data.
      var invoke = window.TS.invoke;
      var formatTokens = window.TS.formatTokens;
      var tokenHTML = window.TS.formatTokenHTML;
      var formatMoney = window.TS.formatMoney;
      var formatPercent = window.TS.formatPercent;
      var formatInterval = window.TS.formatInterval;
      var contributionColor = window.TS.contributionColor;
      var todayKey = window.TS.todayKey;
      var ringSvg = window.TS.ringSvg;
      var ICONS = window.TS.ICONS;
      var listen = window.TS.listen;

      var settings = initialSettings || { daily_goal_tokens: 100000000, refresh_interval_seconds: 60, history_days: 180 };
      var snapshot = initialSnapshot || { totals:{tokens:0,cost:0,active_days:0}, daily:[], tools:[], models:[], sources:{} };
      var current = 'today';
      var latestUpdate = null;
      var SECTIONS = [
        { id:'today', title:'今日', sidebar:'今日消耗', sub:'今天的 Token 使用节奏' },
        { id:'history', title:'历史', sidebar:'历史活动', sub:'长期节奏和所有历史记录' },
        { id:'stats', title:'统计', sidebar:'统计', sub:'按工具与模型的累计分布' },
        { id:'settings', title:'设置', sidebar:'设置', sub:'目标、主题与数据来源' }
      ];

      // Build the full app shell (same as before but proven-safe).
      document.getElementById('app').innerHTML =
        '<main class="content" style="width:100%;flex:1;overflow-y:auto"><div class="page" style="min-width:0"><div class="page-header" style="display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(320px,1fr);align-items:center;column-gap:24px;row-gap:4px"><div style="display:flex;align-items:center;gap:12px;min-width:0"><img src="../shared/logo.png" alt="TokenStep" style="width:30px;height:30px;flex-shrink:0"/><div style="min-width:0"><h2 class="page-title" id="pageTitle" style="font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">今日</h2><p class="page-subtitle" id="pageSubtitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></p></div></div><nav class="nav" id="nav" style="justify-content:center"></nav><div style="display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:2px"><div class="sync-status" style="margin-right:6px"><span class="sync-dot" id="syncDot"></span><span id="syncText">已同步</span></div><button class="btn" style="padding:6px 10px;display:none" id="updateBtn" title="发现新版本">🎁</button><button class="btn" style="padding:6px 10px;position:relative" id="shotBtn" title="截图">📷<div id="shareMenu" style="display:none;position:absolute;top:100%;right:0;margin-top:6px;background:var(--surface);border:1px solid var(--track);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.12);padding:6px;min-width:200px;z-index:50"></div></button><button class="btn" style="padding:6px 10px" id="settingsBtn" title="设置">⚙</button><button class="btn" style="padding:6px 10px" id="refreshBtn" title="刷新">' + ICONS.refresh + '</button><div class="github-row" id="githubRow" style="padding:0;gap:2px;margin-left:6px"><button class="github-link" id="githubRepoBtn" title="GitHub" style="padding:5px 7px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.2-1.5 6.2-6.7A5.2 5.2 0 0 0 20 4.8 4.9 4.9 0 0 0 19.9 1S18.7.6 16 2.5a13.4 13.4 0 0 0-7 0C6.3.6 5.1 1 5.1 1A4.9 4.9 0 0 0 5 4.8a5.2 5.2 0 0 0-1.4 3.7c0 5.1 3.1 6.4 6.1 6.7a3.4 3.4 0 0 0-.9 2.5V22"/></svg></button><button class="github-star" id="githubStarBtn" title="' + window.TS.t('点个 Star') + '" style="gap:3px;padding:5px 7px"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span id="githubStarCount" style="font-size:11px"></span></button></div></div><div class="updated" id="updated" style="grid-column:3;justify-self:end"></div></div><div id="errorBanner"></div><div id="view"></div></div></main>';

      // The reference design uses a fixed product header. Keep pageTitle/pageSubtitle
      // as hidden compatibility targets for existing render/update logic.
      var referenceHeader = document.querySelector('.page-header');
      if (referenceHeader) referenceHeader.classList.add('reference-header');
      var referenceBrand = referenceHeader && referenceHeader.firstElementChild;
      if (referenceBrand) {
        // Design-sheet brand: real TokenStep logo + product name/tagline.
        // #pageTitle/#pageSubtitle stay as hidden compat targets because
        // render()/refreshHeaderI18n() still write the live page title there.
        referenceBrand.className = 'reference-brand';
        referenceBrand.innerHTML = '<div class="reference-brand-logo" role="img" aria-label="TokenStep"><img src="../shared/logo.png" alt="" /></div>' +
          '<div class="reference-brand-copy" style="min-width:0">' +
            '<div class="reference-brand-title">TokenStep<span>|</span><em>' + window.TS.t('本地 AI Token 使用追踪器') + '（Windows）</em></div>' +
            '<div class="reference-brand-subtitle">' + window.TS.t('所有数据仅存储在本机设备，不会上传') + '</div>' +
          '</div>' +
          '<h2 id="pageTitle" class="reference-visually-hidden">今日</h2><p id="pageSubtitle" class="reference-visually-hidden"></p>';
      }
      var referenceShot = document.getElementById('shotBtn');
      if (referenceShot) referenceShot.innerHTML = '<span class="header-action-icon">' + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>' + '</span><div id="shareMenu" style="display:none;position:absolute;top:100%;right:0;margin-top:6px;background:var(--surface);border:1px solid var(--track);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.12);padding:6px;min-width:200px;z-index:50"></div>';
      var referenceSettings = document.getElementById('settingsBtn');
      if (referenceSettings) referenceSettings.innerHTML = ICONS.gear;

      // Nav
      var referenceNavIcons = {
        today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16M8 13h3M8 16h3"/></svg>',
        history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 9h16M8 13h8M8 16h5"/></svg>',
        privacy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.5 7.7-8 9-4.5-1.3-8-4.5-8-9V6z"/></svg>',
        stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-8M22 20H2"/></svg>',
        settings: ICONS.gear
      };
      document.getElementById('nav').innerHTML = SECTIONS.map(function (s) {
        return '<div class="nav-item ' + (s.id === current ? 'active' : '') + '" data-id="' + s.id + '" title="' + s.sub + '"><div class="nav-icon">' + (referenceNavIcons[s.id] || s.icon) + '</div><div class="nav-title">' + s.title + '</div></div>';
      }).join('');
      document.querySelectorAll('.nav-item').forEach(function (el) {
        el.addEventListener('click', function () { current = el.dataset.id; render(); });
      });
      // Update badge in the header: click → open the in-app update dialog.
      document.getElementById('updateBtn').addEventListener('click', function () {
        openUpdateModal();
      });
      // Auto-check for updates on startup (non-blocking, silent).
      invoke('check_for_update').then(function (u) {
        latestUpdate = u;
        var btn = document.getElementById('updateBtn');
        if (btn && u.has_update) {
          btn.style.display = '';
          btn.title = window.TS.tf('发现新版本 v%@，点击安装', u.latest_version);
          // Auto-pop the update dialog on startup when a new version exists,
          // matching the macOS behavior (UpdateWindowPresenter).
          openUpdateModal();
        }
      }).catch(function () { /* silent fail */ });
      document.getElementById('refreshBtn').addEventListener('click', function () {
        invoke('app_version').then(function (v) { window.__tsAppVersion = v; }).catch(function () {});
        // Refresh lifecycle: syncing badge during the pass, re-judge after.
        try {
          window.TS.listen('refresh-started', function () { setSyncingBadge(); });
          window.TS.listen('refresh-finished', function () { updateFreshnessBadge(); });
        } catch (e) { /* events unavailable outside Tauri */ }
        var eb = document.getElementById('errorBanner');
        if (eb) eb.innerHTML = '<div style="padding:8px;background:#e6f7e6;border-radius:8px">' + window.TS.t('刷新中…') + '</div>';
        var dot = document.getElementById('syncDot');
        var txt = document.getElementById('syncText');
        if (dot) dot.classList.add('busy');
        if (txt) { txt.textContent = window.TS.t('同步中…'); txt.dataset.syncing = '1'; }
        this.disabled = true;
        this.classList.add('refreshing');
        var self = this;
        var t0 = Date.now();
        window.TS.invoke('refresh').then(function () {
          return window.TS.invoke('get_snapshot');
        }).then(function (s) {
          snapshot = s; render(); updateHeader();
          // Ensure "同步中…" stays visible at least 800ms so the user sees it.
          var elapsed = Date.now() - t0;
          var finish = function () {
            if (dot) dot.classList.remove('busy');
            if (txt) { txt.textContent = window.TS.t('已同步'); delete txt.dataset.syncing; }
            self.disabled = false;
            self.classList.remove('refreshing');
            if (eb) eb.innerHTML = '';
          };
          if (elapsed < 800) setTimeout(finish, 800 - elapsed); else finish();
        }).catch(function (e) {
          if (eb) eb.innerHTML = '<div style="padding:8px;background:#fee">' + window.TS.t('刷新失败:') + ' ' + (e && e.message ? e.message : e) + '</div>';
          if (txt) txt.textContent = window.TS.t('同步失败');
          if (dot) dot.classList.remove('busy');
          self.disabled = false;
          self.classList.remove('refreshing');
        });
      });
      // Save a canvas as PNG via the Rust save_screenshot command, surfacing
      // the result path (or an error) in the error banner.
      function saveCanvasPng(canvas, eb, label) {
        var dataUrl = canvas.toDataURL('image/png');
        var b64 = dataUrl.split(',')[1];
        var bin = atob(b64);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        window.TS.invoke('save_screenshot', { data: Array.from(arr) }).then(function (path) {
          if (path) {
            if (eb) eb.innerHTML = '<div style="padding:8px;background:#e6f7e6;border-radius:8px">' + (label || window.TS.t('截图')) + window.TS.t('已保存到：') + '<br>' + path + '</div>';
          } else {
            if (eb) eb.innerHTML = '<div style="padding:8px;background:#fee;border-radius:8px">' + window.TS.t('截图保存失败') + '</div>';
          }
          setTimeout(function () { if (eb) eb.innerHTML = ''; }, 4000);
        }).catch(function (e) {
          if (eb) eb.innerHTML = '<div style="padding:8px;background:#fee">' + window.TS.t('保存失败:') + ' ' + (e && e.message ? e.message : e) + '</div>';
        });
      }

      // Render an arbitrary DOM element to a canvas via SVG <foreignObject>.
      // Works in WebView2 (img-src data: is allowed by the CSP). Falls back to
      // null on any error so callers can show a friendly message.
      function domToCanvas(el) {
        var rect = el.getBoundingClientRect();
        var w = Math.ceil(rect.width);
        var h = Math.ceil(rect.height);
        if (w < 2 || h < 2) return null;
        // Clone, inline computed styles so the SVG render matches the live DOM.
        var clone = el.cloneNode(true);
        var withStyles = document.createElement('div');
        withStyles.appendChild(clone);
        // Inline a background so transparent areas aren't black in the PNG.
        var bg = getComputedStyle(document.body).backgroundColor || '#ffffff';
        // Serialize to XHTML (foreignObject requires XML, not HTML).
        var xs = new XMLSerializer().serializeAsString(withStyles);
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '">' +
          '<foreignObject x="0" y="0" width="100%" height="100%">' +
          '<div xmlns="http://www.w3.org/1999/xhtml" style="width:' + w + 'px;height:' + h + 'px;background:' + bg + ';">' +
          xs + '</div></foreignObject></svg>';
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var img = new Image();
        // Return a promise; resolve once the SVG image loads and is drawn.
        return new Promise(function (resolve, reject) {
          img.onload = function () { try { c.getContext('2d').drawImage(img, 0, 0); resolve(c); } catch (e) { reject(e); } };
          img.onerror = function () { reject(new Error('render failed')); };
          img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        });
      }

      // ---- Share menu (port of macOS PopoverCaptureMenuButton) ----
      // Replaces the single shot-button. Offers share cards (today/yesterday/
      // rhythm) + full-page screenshot, each as copy-to-clipboard or save-PNG.
      function buildShareMenu() {
        var menu = document.getElementById('shareMenu');
        if (!menu) return;
        var hasToday = snapshot.daily && snapshot.daily.length;
        var hasYesterday = snapshot.daily && snapshot.daily.length >= 2;
        var todayRhythm = (snapshot.rhythms || []).filter(function (r) { return r.date === window.TS.todayKey(); })[0];
        var hasRhythm = !!todayRhythm;
        var items = [
          { key: 'copy_today', label: window.TS.t('复制今日卡片'), enabled: hasToday, action: function () { shareCard('today', true); } },
          { key: 'save_today', label: window.TS.t('保存今日卡片'), enabled: hasToday, action: function () { shareCard('today', false); } },
          { key: 'copy_yesterday', label: window.TS.t('复制昨日卡片'), enabled: hasYesterday, action: function () { shareCard('yesterday', true); } },
          { key: 'save_yesterday', label: window.TS.t('保存昨日卡片'), enabled: hasYesterday, action: function () { shareCard('yesterday', false); } },
          { key: 'copy_rhythm', label: window.TS.t('复制节奏卡片'), enabled: hasRhythm, action: function () { shareRhythmCard(true); } },
          { key: 'save_rhythm', label: window.TS.t('保存节奏卡片'), enabled: hasRhythm, action: function () { shareRhythmCard(false); } },
          { key: 'copy_page', label: window.TS.t('复制本页截图'), enabled: true, action: function () { capturePage(true); } },
          { key: 'save_page', label: window.TS.t('保存本页截图'), enabled: true, action: function () { capturePage(false); } },
        ];
        menu.innerHTML = items.map(function (it) {
          return '<div class="share-menu-item" data-key="' + it.key + '" style="padding:9px 14px;border-radius:8px;cursor:' + (it.enabled ? 'pointer' : 'default') + ';font-size:14px;font-weight:600;color:' + (it.enabled ? 'var(--ink)' : 'var(--mutedFaint)') + ';white-space:nowrap">' + it.label + '</div>';
        }).join('');
        items.forEach(function (it) {
          var el = menu.querySelector('[data-key="' + it.key + '"]');
          if (el && it.enabled) {
            el.addEventListener('mouseenter', function () { el.style.background = 'var(--canvas)'; });
            el.addEventListener('mouseleave', function () { el.style.background = 'transparent'; });
            el.addEventListener('click', function (e) {
              e.stopPropagation();
              menu.style.display = 'none';
              it.action();
            });
          }
        });
      }

      // Render a daily share card (today/yesterday) to a canvas, then copy or save.
      function shareCard(mode, copy) {
        var eb = document.getElementById('errorBanner');
        try {
          var idx = mode === 'yesterday' ? 2 : 1;
          var day = snapshot.daily[snapshot.daily.length - idx];
          var previousDay = snapshot.daily[snapshot.daily.length - idx - 1];
          if (!day) { if (eb) eb.innerHTML = '<div style="padding:8px;background:#fee">' + window.TS.t('暂无数据') + '</div>'; return; }
          var c = document.createElement('canvas');
          c.width = 600;
          // height is set by renderShareDailyCard (auto-grows to fit content).
          window.TS.renderShareDailyCard(c, {
            day: day, previousDay: previousDay,
            daily30: snapshot.daily.slice(-30),
            settings: settings, mode: mode,
            totals: snapshot.totals || {},
            goalDays: snapshot.daily.filter(function (d) { return d.total_tokens >= settings.daily_goal_tokens; }).length,
          });
          finishCard(c, copy, eb);
        } catch (e) {
          if (eb) eb.innerHTML = '<div style="padding:8px;background:#fee">' + window.TS.t('截图失败:') + ' ' + (e && e.message ? e.message : e) + '</div>';
        }
      }

      // Render the rhythm share card (upstream: YESTERDAY's rhythm —
      // PopoverPanelView.shareDay(.yesterday)).
      function shareRhythmCard(copy) {
        var eb = document.getElementById('errorBanner');
        try {
          var yKey = window.TS.yesterdayKey();
          var rhythm = (snapshot.rhythms || []).filter(function (r) { return r.date === yKey && r.total_tokens > 0; })[0];
          if (!rhythm) { if (eb) eb.innerHTML = '<div style="padding:8px;background:#fee">' + window.TS.t('昨日节奏还在等待同步') + '</div>'; return; }
          var yDay = (snapshot.daily || []).filter(function (d) { return d.date === yKey; })[0] || { total_tokens: rhythm.total_tokens, cost: 0, tools: {}, models: {} };
          var c = document.createElement('canvas');
          c.width = 600; c.height = 840;
          window.TS.renderRhythmCard(c, { rhythm: rhythm, date: rhythm.date, day: yDay });
          finishCard(c, copy, eb);
        } catch (e) {
          if (eb) eb.innerHTML = '<div style="padding:8px;background:#fee">' + window.TS.t('截图失败:') + ' ' + (e && e.message ? e.message : e) + '</div>';
        }
      }

      // Full-page screenshot via domToCanvas.
      // Full-page screenshot: re-render the Today view as a Canvas image
      // (the old domToCanvas/foreignObject approach fails under WebView2
      // because cloned nodes lose their CSS-variable colors). This produces
      // a stable, good-looking PNG of today's overview.
      function capturePage(copy) {
        var eb = document.getElementById('errorBanner');
        if (!snapshot.daily || !snapshot.daily.length) {
          if (eb) eb.innerHTML = '<div style="padding:8px;background:#fee">' + window.TS.t('暂无数据') + '</div>';
          return;
        }
        try {
          var c = document.createElement('canvas');
          c.width = 720;
          window.TS.renderTodayOverview(c, {
            snapshot: snapshot,
            settings: settings,
          });
          finishCard(c, copy, eb);
        } catch (e) {
          if (eb) eb.innerHTML = '<div style="padding:8px;background:#fee">' + window.TS.t('截图失败:') + ' ' + (e && e.message ? e.message : e) + '</div>';
          setTimeout(function () { if (eb) eb.innerHTML = ''; }, 4000);
        }
      }

      // Copy canvas PNG to clipboard, or save it. Falls back to save if
      // the clipboard API is unavailable.
      function finishCard(canvas, copy, eb) {
        if (copy && navigator.clipboard && window.ClipboardItem) {
          canvas.toBlob(function (blob) {
            if (!blob) { saveCanvasPng(canvas, eb); return; }
            try {
              navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function () {
                if (eb) eb.innerHTML = '<div style="padding:8px;background:#e6f7e6;border-radius:8px">' + window.TS.t('已复制到剪贴板') + '</div>';
                setTimeout(function () { if (eb) eb.innerHTML = ''; }, 2500);
              }).catch(function () { saveCanvasPng(canvas, eb); });
            } catch (err) { saveCanvasPng(canvas, eb); }
          }, 'image/png');
        } else {
          saveCanvasPng(canvas, eb);
        }
      }

      var shotBtn = document.getElementById('shotBtn');
      if (shotBtn) shotBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        var menu = document.getElementById('shareMenu');
        if (!menu) return;
        var open = menu.style.display === 'block';
        if (!open) buildShareMenu();
        menu.style.display = open ? 'none' : 'block';
      });
      // Click outside closes the menu.
      document.addEventListener('click', function () {
        var menu = document.getElementById('shareMenu');
        if (menu) menu.style.display = 'none';
      });

      function todayDaily() {
        var key = todayKey();
        var found = null;
        for (var i = snapshot.daily.length - 1; i >= 0; i--) { if (snapshot.daily[i].date === key) { found = snapshot.daily[i]; break; } }
        return found || snapshot.daily[snapshot.daily.length - 1] || { date: key, tools: {}, total_tokens: 0, cost: 0 };
      }
      function todayProgress() {
        var goal = Math.max(1, settings.daily_goal_tokens);
        return todayDaily().total_tokens / goal;
      }

      function activityBars(rows, goal) {
        if (!rows.length) return '<div class="empty">' + window.TS.t('暂无活动数据') + '</div>';
        var maxTokens = Math.max.apply(null, [goal].concat(rows.map(function (d) { return d.total_tokens; })).concat([1]));
        return '<div class="activity" style="margin-top:14px">' + rows.map(function (d) {
          var h = Math.max(4, (d.total_tokens / maxTokens) * 100);
          return '<div class="bar" style="height:' + h + '%;background:' + contributionColor(d.total_tokens, goal) + '" title="' + d.date + ' ' + formatTokens(d.total_tokens) + '"></div>';
        }).join('') + '</div>';
      }
      function usageRows(rows, nameFn) {

      function viewToday() {

          var start = new Date(now);
          start.setHours(0, 0, 0, 0);
          var elapsedMinutes = Math.max(1, (now.getTime() - start.getTime()) / 60000);
          var rate = total / elapsedMinutes;
          if (!(rate > 0)) return window.TS.t('等待同步');
          var eta = new Date(now.getTime() + (remaining / rate) * 60000);
          if (eta.getDate() !== now.getDate()) return window.TS.t('明天');
          return window.TS.t('今天') + ' ' + String(eta.getHours()).padStart(2, '0') + ':' + String(eta.getMinutes()).padStart(2, '0');
        }

        function clientName(name) {
          var map = { Codex: 'ChatGPT', 'Claude Code': 'Claude' };
          return map[name] || name;
        }

        function breakdownRows(source, kind) {

          var rows = Object.keys(source || {}).map(function (name) {

          if (kind === 'client') {
            var pinned = ['Codex', 'Claude Code'].filter(function (name) {
              return rows.some(function (row) { return row.name === name && row.value > 0; });
            });
            var rest = rows.filter(function (row) { return pinned.indexOf(row.name) < 0; }).sort(function (a, b) { return b.value - a.value; });
            ordered = pinned.map(function (name) { return rows.filter(function (row) { return row.name === name; })[0]; }).concat(rest);
            if (ordered.length > 2) ordered = ordered.filter(function (row, index) { return index < 2 || row.value * 100 / Math.max(1, totalValue) >= 0.1; });

      // Unified quota loading (upstream v0.2.2): one card, chips per provider,
      // low-remaining sorts first, failures keep the last value (never 0%).
      function loadQuotaProviders(force) {
        var host = document.getElementById('quotaProvidersContent');
        var card = document.getElementById('quotaProvidersCard');
        if (!host || !card) return;
        invoke('read_quota_providers', { force: !!force }).then(function (r) {
          var list = (r && r.providers) || [];
          var displayable = list.filter(function (p) { return (p.status === 'available' || p.status === 'Available') && p.windows && p.windows.length; });
          if (!displayable.length) {
            card.style.display = '';
            // Distinguish "nothing enabled" from "enabled but failed": the
            // backend now pushes unavailable providers with a message, so
            // surface the first reason (e.g. 未找到 codex 命令) instead of a
            // misleading 未配置.
            var reason = list.map(function (p) { return p.message || p.error; }).filter(Boolean)[0];
            if (reason && reason.length > 30) reason = reason.slice(0, 30) + '…';
            var statusText = list.length ? (reason ? '暂不可用 · ' + reason : '暂不可用') : '未配置';
            host.innerHTML = quotaPlaceholderHTML(statusText);
            return;
          }
          card.style.display = '';
          displayable.sort(function (a, b) {
            var la = lowest(a), lb = lowest(b);
            return la - lb; // lowest remaining first (告急置顶)
            function lowest(p) {
              return p.windows.reduce(function (m, w) {
                var rem = w.total > 0 ? (w.remaining != null ? w.remaining / w.total * 100 : 100 - (w.used_percent || 0)) : (100 - (w.used_percent || 0));
                return Math.min(m, Math.max(0, Math.min(100, rem)));
              }, 101);
            }
          });
          var quotaLogos = { openai: '../shared/logos/openai.svg', anthropic: '../shared/logos/anthropic.svg', google: '../shared/logos/google.svg' };
          var quotaColors = { openai: 'var(--green)', codex: 'var(--green)', anthropic: '#f59e0b', claude: '#f59e0b', google: '#2563eb', local: '#9ca3af' };
          var serverIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>';
          function quotaMark(provider, name) {
            if (quotaLogos[provider]) return '<span class="today-quota-logo"><img src="' + quotaLogos[provider] + '" alt=""/></span>';
            if (provider === 'local') return '<span class="today-quota-logo today-quota-server">' + serverIcon + '</span>';
            return '<span class="today-source-mark" style="--source-color:#9ca3af">' + window.TS.escapeHtmlStr(String(name || '?').slice(0, 1).toUpperCase()) + '</span>';
          }
          // Keep the four provider slots from the design sheet populated when
          // only one real provider is available. These are visual placeholders
          // only; no provider is enabled or queried by adding them here.
          var quotaFallbacks = [
            { provider: 'anthropic', name: 'Anthropic', tone: 'amber' },
            { provider: 'google', name: 'Google', tone: 'blue' },
            { provider: 'local', name: window.TS.t('本地模型'), tone: 'local' },
            { provider: 'openai', name: 'OpenAI', tone: 'green' }
          ];
          function quotaPlaceholderCard(p) {
            return '<div class="today-quota-placeholder-card ' + p.tone + '">' +
              '<div class="today-quota-provider-title">' + quotaMark(p.provider, p.name) + '<strong>' + p.name + '</strong></div>' +
              '<div class="today-quota-placeholder-value">—</div>' +
              '<div class="today-quota-placeholder-track"></div>' +
              '<small>' + window.TS.t('暂未读取到额度') + '</small>' +
            '</div>';
          }
          function quotaWan(value) {
            var v = Math.max(0, Math.round(Number(value || 0)));
            return tokenHTML(v, true);
          }
          function quotaResetText(w) {
            var iso = w.resets_at || w.reset_at;
            var ms = iso && Date.parse(iso);
            if (!ms || isNaN(ms)) return window.TS.t('本地运行');
            var days = Math.ceil((ms - Date.now()) / 86400000);
            if (days <= 0) return window.TS.t('重置：即将');
            return window.TS.t('重置') + '：' + days + ' ' + window.TS.t('天后');
          }
          var knownProviders = {};
          displayable.forEach(function (p) { knownProviders[p.provider] = true; });
          var missing = quotaFallbacks.filter(function (p) { return !knownProviders[p.provider]; }).slice(0, Math.max(0, 4 - displayable.length));
          host.innerHTML = '<div class="today-quota-provider-grid" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">' + displayable.map(function (p) {
            var name = p.displayName || p.display_name || { codex: 'Codex', claude: 'Claude Code', cursor: 'Cursor', glm: 'GLM', kimi: 'Kimi', grok: 'Grok', openai: 'OpenAI', anthropic: 'Anthropic', google: 'Google', local: window.TS.t('本地模型') }[p.provider] || p.provider;
            var color = quotaColors[p.provider] || 'var(--green)';
            var w = p.windows[0] || {};
            var used = Math.max(0, Math.min(100, w.used_percent != null ? Number(w.used_percent) : (w.total > 0 && w.remaining != null ? 100 - w.remaining / w.total * 100 : 0)));
            var isLocalWindow = p.provider === 'local' || w.kind === 'local';
            var hasTotal = Number(w.total) > 0;
            var hasUsedPercent = w.used_percent != null;
            var usedLabel = isLocalWindow ? '—' : (hasUsedPercent ? Math.round(used) + '% ' + window.TS.t('已用') : (hasTotal ? Math.round(used) + '% ' + window.TS.t('已用') : '—'));
            var amountLabel = hasTotal ? quotaWan(w.total * used / 100) + ' / ' + quotaWan(w.total) : (isLocalWindow ? window.TS.t('不设上限') : '—');
            var resetLabel = isLocalWindow ? window.TS.t('本地运行') : quotaResetText(w);
            return '<div class="today-quota-provider" style="--quota-color:' + color + '">' +
              '<div class="today-quota-provider-title">' + quotaMark(p.provider, name) + '<span>' + name + '</span></div>' +
              '<div class="today-quota-used">' + usedLabel + '</div>' +
              '<div class="today-quota-track"><span style="width:' + (isLocalWindow ? 0 : used).toFixed(0) + '%"></span></div>' +
              '<div class="today-quota-amount">' + amountLabel + '</div>' +
              '<div class="today-quota-reset">' + resetLabel + '</div>' +
            '</div>';
          }).join('') + missing.map(quotaPlaceholderCard).join('') + '</div>';
        }).catch(function () {
          card.style.display = '';
          host.innerHTML = quotaPlaceholderHTML('同步失败');
        });
      }

      function rankBoardHTML(r) {
        r = r || {};
        var esc = window.TS.escapeHtmlStr;
        var entries = [];
        function addEntry(entry) {
          if (!entry) return;
          var key = entry.user_id || entry.name || entry.rank;
          if (!entries.some(function (item) { return (item.user_id || item.name || item.rank) === key; })) entries.push(entry);
        }
        addEntry(r.top);
        addEntry(r.mine);
        // Additive backend `rows` (top 5) feeds the podium slots too, so
        // rank 3 shows the real entry instead of the 其他 aggregate.
        (r.rows || []).forEach(addEntry);
        entries.sort(function (a, b) { return (a.rank || 999) - (b.rank || 999); });

        function entryFor(rank) {
          return entries.filter(function (entry) { return Number(entry.rank || 0) === rank; })[0] || null;
        }
        var knownTokens = entries.reduce(function (sum, entry) { return sum + Math.max(0, Number(entry.total_tokens || 0)); }, 0);
        var otherTokens = Math.max(0, Number(r.total_tokens || 0) - knownTokens);
        if (!entryFor(3) && otherTokens > 0) {
          entries.push({ rank: 3, name: window.TS.t('其他'), total_tokens: otherTokens, synthetic: true });
        }
        function slot(rank, order) {
          var entry = entryFor(rank);
          var name = entry ? esc(entry.name || window.TS.t('未命名项目')) : window.TS.t('等待同步');
          var tokens = entry ? tokenHTML(entry.total_tokens) : '—';
          var crownClass = rank === 1 ? 'gold' : (rank === 2 ? 'silver' : 'bronze');
          return '<div class="today-rank-slot rank-' + rank + (entry ? '' : ' is-empty') + '" style="--rank-order:' + order + '">' +
            '<div class="today-rank-crown ' + crownClass + '">♛</div>' +
            '<div class="today-rank-podium"><div class="today-rank-badge ' + crownClass + '">' + rank + '</div><span>' + name + '</span><strong>' + tokens + '</strong></div>' +
          '</div>';
        }
        var status = r.error ? esc(r.error) : (r.available
          ? ((r.total_ranked_users || 0) + ' ' + window.TS.t('人') + ' · ' + window.TS.t('今日'))
          : window.TS.t('等待同步'));
        var mineMeta = r.mine && r.mine.rank > 3
          ? '<span class="today-rank-mine">' + window.TS.t('我的排名') + ' #' + r.mine.rank + '</span>'
          : '';
        var board = '<div class="today-rank-board">' + slot(2, 0) + slot(1, 1) + slot(3, 2) + '</div>';
        // Design-sheet layout: podium left + ranks 4/5 (and 其他 aggregate) list
        // right. Requires the additive `rows` field (top 5) from the backend;
        // older backends fall back to the footer status line.
        var rows = (r.rows || []).slice().sort(function (a, b) { return (a.rank || 999) - (b.rank || 999); });
        if (rows.length > 3) {
          function listRow(no, name, tokens, mine) {
            return '<div' + (mine ? ' class="today-rank-list-mine"' : '') + '><span class="today-rank-list-no">' + no + '</span>' +
              '<span class="today-rank-list-name">' + esc(name || window.TS.t('未命名项目')) + '</span>' +
              '<span class="today-rank-list-value">' + tokenHTML(tokens) + '</span></div>';
          }
          var top5 = rows.slice(0, 5);
          var known5 = top5.reduce(function (sum, entry) { return sum + Math.max(0, Number(entry.total_tokens || 0)); }, 0);
          var restTokens = Math.max(0, Number(r.total_tokens || 0) - known5);
          var items = top5.slice(3).map(function (entry) { return listRow(entry.rank, entry.name, entry.total_tokens, false); });
          if (restTokens > 0) items.push(listRow('', window.TS.t('其他'), restTokens, false));
          if (r.mine && r.mine.rank > 5) items.push(listRow(r.mine.rank, r.mine.name, r.mine.total_tokens, true));
          return '<div class="today-rank-wrap">' + board + '<div class="today-rank-list">' + items.join('') + '</div></div>';
        }
        return board + '<div class="today-rank-foot"><span>' + status + '</span>' + mineMeta + '</div>';

      function updateFreshnessBadge() {
      var host = document.getElementById('syncText');
      if (!host) return;
      invoke('get_freshness').then(function (f) {
      if (!f || !f.collection) return;
      // A collect pass is running: the attempt timestamp was already stamped
      // at its START, so judging from it would flash "同步失败" mid-pass
      // (worst on a cold cache, where the first full rebuild takes minutes).
      if (f.refreshing) {
      host.innerHTML = window.TS.freshnessBadgeHTML('syncing');
      return;
      }
      var kind = f.collection.kind || 'never_succeeded';
      var suffix = '';
      if ((kind === 'stale' || kind === 'aging') && f.collection.last_succeeded_at) {
      suffix = ' <span style="opacity:.7">' + window.TS.t('显示最后成功数据') + '</span>';

      // Re-apply language translations after every render (DOM was replaced).
      // CRITICAL: sync __tsLang BEFORE _origRender() runs, because the view
      // builders (viewToday/viewHistory/...) call formatTokens/t()/tf() while
      // generating the DOM — those read window.__tsLang at generation time.
      // Setting it after would leave the first render using a stale language.
      var _origRender = render;
      render = function () {
        window.__tsLang = settings.language || 'zhHans';
        _origRender();
        if (typeof applyLanguage === 'function' && settings.language && settings.language !== 'zhHans') {
          applyLanguage(settings.language);
        }

      function updateHeader() {
        // Build the "updated at" string in Chinese, then translate via t() so
        // the prefix ("更新 "/"Updated ") follows the current language.
        var prefix = window.TS.t('更新 ');
        var when = snapshot.generated_at ? window.TS.formatGeneratedTime(snapshot.generated_at) : window.TS.t('等待同步');
        document.getElementById('updated').textContent = prefix + when;
      }

      // Translate elements that live OUTSIDE #view (so render() never
      // rebuilds them): the sidebar brand/privacy text, the sync-status text,
      // button tooltips, and the update badge title. Called after every
      // language switch + every render(). Also handles restoring the Chinese
      // source text when switching back to zhHans.
      function refreshHeaderI18n() {
        var lang = window.__tsLang || 'zhHans';
        var T = (lang !== 'zhHans' && window.I18N) ? (window.I18N[lang] || {}) : {};
        var tr = function (zh) { return T[zh] || zh; };
        // Sidebar (built once in init; never rebuilt by render).
        var brand = document.querySelector('.brand-text p'); if (brand) brand.textContent = tr('每天一个亿');
        var pbTitle = document.querySelector('.pb-title'); if (pbTitle) pbTitle.textContent = tr('本地统计');
        var pbSub = document.querySelector('.pb-sub'); if (pbSub) pbSub.textContent = tr('不上传代码或对话');
        // Nav items (also built once in init). Translate each item's title +
        // subtitle from the SECTIONS source strings, in order.
        var navItems = document.querySelectorAll('.nav-item');
        if (navItems.length && typeof SECTIONS !== 'undefined') {
          navItems.forEach(function (el, i) {
            var sec = SECTIONS[i];
            if (!sec) return;
            var t = el.querySelector('.nav-title'); if (t) t.textContent = tr(sec.title);
            var s = el.querySelector('.nav-sub'); if (s) s.textContent = tr(sec.sub);
          });
        }
        // Sync status text (only translate the idle value; leave in-progress alone).
        var st = document.getElementById('syncText');
        if (st && !st.dataset.syncing) st.textContent = tr('已同步');
        // Button tooltips.
        var ub = document.getElementById('updateBtn'); if (ub) ub.title = tr('发现新版本');
        var sb = document.getElementById('shotBtn'); if (sb) sb.title = tr('截图');
        var rb = document.getElementById('refreshBtn'); if (rb) rb.title = tr('刷新');
        updateHeader();
      }

      // ── Update dialog ──────────────────────────────────────────────
      // The modal is built dynamically (NOT in static HTML) so that <body>
      // keeps only <div id="app"> as its child, exactly like the original
      // layout. The modal is appended on first use and hidden otherwise.
      var umReady = false;     // has the modal DOM been injected?
      var umDownloading = false; // guards against double-click during install

      // Parse markdown-ish release notes into up to 4 bullet lines, mirroring
      // the macOS `AvailableUpdate.noteLines`. Strips `#`, `**`, leading dashes.
      function updateNoteLines(notes) {
        if (!notes) return [];
        return notes.split('\n').map(function (l) {
          return l.trim().replace(/^[-•*]\s*/, '').replace(/^\d+\.\s*/, '').replace(/[*`]/g, '').trim();
        }).filter(function (l) {
          return l && l[0] !== '#' && !/^sha256/i.test(l);
        }).slice(0, 4);
      }

      // Lazily inject the modal <style> + DOM into <body>. Idempotent.
      function ensureUpdateModal() {
        if (umReady) return;
        var css = '' +
          '#updateModal{position:fixed;inset:0;background:rgba(15,18,22,.42);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:9000}' +
          '#updateModal.open{display:flex}' +
          '.um-card{width:520px;max-width:92vw;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.32);padding:26px}' +
          '.um-head{display:flex;gap:14px;align-items:flex-start}' +
          '.um-logo{width:52px;height:52px;border-radius:14px;flex-shrink:0}' +
          '.um-ver{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.01em}' +
          '.um-sub{font-size:13px;color:var(--muted);margin-top:3px;font-weight:600}' +
          '.um-notes{margin-top:18px;background:var(--canvas);border-radius:14px;padding:14px 16px}' +
          '.um-notes-title{font-weight:800;color:var(--ink);margin-bottom:10px;font-size:14px}' +
          '.um-note{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink);opacity:.82;font-weight:600;margin-top:8px}' +
          '.um-note:first-of-type{margin-top:0}' +
          '.um-note .chk{color:var(--green);flex-shrink:0;font-size:13px;padding-top:2px}' +
          '.um-trust{display:flex;gap:11px;align-items:center;margin-top:16px;padding:12px 14px;background:color-mix(in srgb,var(--green) 8%,transparent);border-radius:14px}' +
          '.um-trust .sh{width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--green) 22%,transparent);display:flex;align-items:center;justify-content:center;color:var(--green-dark);font-size:16px;flex-shrink:0}' +
          '.um-trust .t1{font-weight:800;color:var(--ink);font-size:13.5px}' +
          '.um-trust .t2{font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}' +
          '.um-size{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--ink);opacity:.6;background:var(--canvas);padding:4px 10px;border-radius:999px;white-space:nowrap}' +
          '.um-prog-wrap{margin-top:16px;display:none}' +
          '.um-prog-wrap.show{display:block}' +
          '.um-prog-top{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}' +
          '.um-prog-track{height:8px;background:var(--canvas);border-radius:999px;overflow:hidden}' +
          '.um-prog-fill{height:100%;width:0%;background:var(--green);border-radius:999px;transition:width .18s ease}' +
          '.um-foot{display:flex;gap:9px;margin-top:22px;align-items:center}' +
          '.um-foot .spacer{flex:1}' +
          '.um-err{margin-top:12px;padding:10px 12px;background:#fee;color:#c33;border-radius:10px;font-size:13px;font-weight:700;display:none}' +
          '.um-err.show{display:block}';
        var st = document.createElement('style');
        st.textContent = css;
        document.head.appendChild(st);

        var wrap = document.createElement('div');
        wrap.id = 'updateModal';
        wrap.innerHTML =
          '<div class="um-card">' +
            '<div class="um-head">' +
              '<img class="um-logo" src="../shared/logo.png" alt="TokenStep" />' +
              '<div>' +
                '<div class="um-ver" id="umVersion">TokenStep 0.0.0</div>' +
                '<div class="um-sub">' + window.TS.t('安装完成后会自动重启到新版本') + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="um-notes">' +
              '<div class="um-notes-title">' + window.TS.t('更新内容') + '</div>' +
              '<div id="umNotes"></div>' +
            '</div>' +
            '<div class="um-trust">' +
              '<div class="sh">🛡</div>' +
              '<div>' +
                '<div class="t1">' + window.TS.t('自动安装到原目录') + '</div>' +
                '<div class="t2">' + window.TS.t('下载后会静默替换旧版本') + '</div>' +
              '</div>' +
              '<div class="um-size" id="umSize">—</div>' +
            '</div>' +
            '<div class="um-prog-wrap" id="umProgWrap">' +
              '<div class="um-prog-top">' +
                '<span id="umProgLabel">' + window.TS.t('下载中…') + '</span>' +
                '<span id="umProgPct">0%</span>' +
              '</div>' +
              '<div class="um-prog-track"><div class="um-prog-fill" id="umProgFill"></div></div>' +
            '</div>' +
            '<div class="um-err" id="umErr">' + window.TS.t('下载失败，请检查网络后重试。') + '</div>' +
            '<div class="um-foot">' +
              '<button class="btn" id="umSkip">' + window.TS.t('跳过此版本') + '</button>' +
              '<div class="spacer"></div>' +
              '<button class="btn" id="umLater">' + window.TS.t('稍后') + '</button>' +
              '<button class="btn" id="umInstall" style="background:var(--green);color:#fff;font-weight:800;padding:9px 18px">' + window.TS.t('安装并重启') + '</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(wrap);

        // Wire buttons once, now that the DOM exists.
        document.getElementById('umInstall').addEventListener('click', beginUpdateInstall);
        document.getElementById('umLater').addEventListener('click', closeUpdateModal);
        document.getElementById('umSkip').addEventListener('click', function () {
          if (!latestUpdate || umDownloading) return;
          invoke('skip_update_version', { version: latestUpdate.latest_version }).then(function () {
            latestUpdate = null;
            var btn = document.getElementById('updateBtn');
            if (btn) btn.style.display = 'none';
            closeUpdateModal();
          });
        });
        umReady = true;
      }

      function openUpdateModal() {
        if (!latestUpdate || !latestUpdate.has_update) return;
        ensureUpdateModal();
        var m = document.getElementById('updateModal');
        // Refresh the modal's STATIC text on every open so it follows the
        // current language (ensureUpdateModal builds the DOM only once, so a
        // language switch after first open would otherwise leave stale text).
        var umSub = document.querySelector('#updateModal .um-sub'); if (umSub) umSub.textContent = window.TS.t('安装完成后会自动重启到新版本');
        var umNt = document.querySelector('#updateModal .um-notes-title'); if (umNt) umNt.textContent = window.TS.t('更新内容');
        var umT1 = document.querySelector('#updateModal .um-trust .t1'); if (umT1) umT1.textContent = window.TS.t('自动安装到原目录');
        var umT2 = document.querySelector('#updateModal .um-trust .t2'); if (umT2) umT2.textContent = window.TS.t('下载后会静默替换旧版本');
        var umPl = document.getElementById('umProgLabel'); if (umPl) umPl.textContent = window.TS.t('下载中…');
        var umErr = document.getElementById('umErr'); if (umErr) umErr.textContent = window.TS.t('下载失败，请检查网络后重试。');
        var umSkip = document.getElementById('umSkip'); if (umSkip) umSkip.textContent = window.TS.t('跳过此版本');
        var umLater = document.getElementById('umLater'); if (umLater) umLater.textContent = window.TS.t('稍后');
        document.getElementById('umVersion').innerHTML = window.TS.tf('TokenStep %@ 可用', (latestUpdate.latest_version || '').replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }));
        var lines = updateNoteLines(latestUpdate.release_notes);
        if (!lines.length) {
          lines = [window.TS.t('优化 Codex 历史数据读取'), window.TS.t('降低后台刷新 CPU 占用'), window.TS.t('提升菜单栏同步稳定性')];
        }
        document.getElementById('umNotes').innerHTML = lines.map(function (n) {
          return '<div class="um-note"><span class="chk">✓</span><span>' + (n || '').replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</span></div>';
        }).join('');
        var sz = latestUpdate.asset_size;
        document.getElementById('umSize').textContent = sz ? (sz / 1048576).toFixed(1) + ' MB' : '—';
        document.getElementById('umProgWrap').classList.remove('show');
        document.getElementById('umErr').classList.remove('show');
        document.getElementById('umProgFill').style.width = '0%';
        document.getElementById('umProgPct').textContent = '0%';
        umDownloading = false;
        var inst = document.getElementById('umInstall');
        inst.textContent = latestUpdate.asset_url ? window.TS.t('安装并重启') : window.TS.t('前往下载');
        inst.disabled = false;
        inst.style.opacity = '1';
        document.getElementById('umSkip').disabled = false;
        document.getElementById('umLater').disabled = false;
        m.classList.add('open');
      }

      function closeUpdateModal() {
        if (umDownloading) return; // don't allow closing mid-install
        var m = document.getElementById('updateModal');
        if (m) m.classList.remove('open');
      }

      function beginUpdateInstall() {
        if (!latestUpdate) return;
        if (!latestUpdate.asset_url) {
          if (latestUpdate.release_url) invoke('open_release_page', { url: latestUpdate.release_url });
          closeUpdateModal();
          return;
        }
        if (umDownloading) return;
        umDownloading = true;
        document.getElementById('umProgWrap').classList.add('show');
        document.getElementById('umErr').classList.remove('show');
        var inst = document.getElementById('umInstall');
        inst.disabled = true;
        inst.style.opacity = '.6';
        document.getElementById('umSkip').disabled = true;
        document.getElementById('umLater').disabled = true;
        invoke('download_and_install_update', {
          asset_url: latestUpdate.asset_url,
          asset_name: latestUpdate.asset_name || '',
          asset_size: latestUpdate.asset_size || 0,
          version: latestUpdate.latest_version
        });
      }

      // events
      listen('refresh-finished', function () { invoke('get_snapshot').then(function (s) { snapshot = s; render(); updateHeader(); }); });
      listen('snapshot-updated', function () { invoke('get_snapshot').then(function (s) { snapshot = s; render(); updateHeader(); }); });
      // A newer release was found (startup check / tray menu check) → pop dialog.
      listen('update-available', function (e) {
        latestUpdate = e.payload;
        var btn = document.getElementById('updateBtn');
        if (btn && latestUpdate && latestUpdate.has_update) {
          btn.style.display = '';
          btn.title = window.TS.tf('发现新版本 v%@，点击安装', latestUpdate.latest_version);
          openUpdateModal();
        }
      });
      // Download progress → fill the progress bar.
      listen('update-download-progress', function (e) {
        if (!umReady) return;
        var p = e.payload || {};
        var pct = p.total > 0 ? Math.min(100, Math.round(p.percent)) : 0;
        document.getElementById('umProgFill').style.width = pct + '%';
        document.getElementById('umProgPct').textContent = pct + '%';
      });
      // Download failed → show error, re-enable buttons so the user can retry.
      listen('update-download-error', function () {
        if (!umReady) return;
        umDownloading = false;
        document.getElementById('umErr').classList.add('show');
        var inst = document.getElementById('umInstall');
        inst.disabled = false;
        inst.style.opacity = '1';
        document.getElementById('umSkip').disabled = false;
        document.getElementById('umLater').disabled = false;
      });
      render();
      // Apply saved language after first render (DOM-walk text replacement).
      if (typeof applyLanguage === 'function') {
        applyLanguage((initialSettings && initialSettings.language) || 'zhHans');
      }
      updateHeader();
    }
  </script>
</body>
</html>
